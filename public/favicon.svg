<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A30000" />
      <stop offset="100%" stop-color="#6E0000" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#141210" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Key Base Shadow -->
  <rect x="10" y="14" width="108" height="106" rx="20" fill="#141210" />

  <!-- Main Key Face -->
  <rect x="10" y="8" width="108" height="100" rx="18" fill="#8B0000" stroke="#141210" stroke-width="3"/>
  
  <!-- Inner Key Inset -->
  <rect x="18" y="16" width="92" height="84" rx="12" fill="#FAF7F0" stroke="#141210" stroke-width="2"/>

  <!-- Top Inset Highlight -->
  <rect x="22" y="20" width="84" height="26" rx="6" fill="#EDE9DF" opacity="0.6"/>

  <!-- Key Letter Text: কী -->
  <text x="64" y="68" font-family="'Tiro Bangla', 'Noto Serif Bengali', serif" font-weight="900" font-size="44" fill="#8B0000" text-anchor="middle" dominant-baseline="middle">কী</text>
  
  <!-- Sub-label: LIPI -->
  <text x="64" y="88" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="11" letter-spacing="3" fill="#141210" text-anchor="middle">LIPI</text>
</svg>
